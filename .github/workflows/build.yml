name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          # main.dart faylini vaqtinchalik saqlab turamiz
          if [ -f main.dart ]; then
            cp main.dart /tmp/main.dart
          elif [ -f lib/main.dart ]; then
            cp lib/main.dart /tmp/main.dart
          fi
          
          # Hozirgi papkada to'liq yangi flutter loyihasini hosil qilamiz (gradle va barcha fayllar bilan)
          flutter create . --org com.linky --project-name linky_app --platforms android
          
          # O'zimizning main.dart faylimizni joyiga qo'yamiz
          if [ -f /tmp/main.dart ]; then
            cp /tmp/main.dart lib/main.dart
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build
          
